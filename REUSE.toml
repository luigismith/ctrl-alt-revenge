version = 1

# Quando più tabelle corrispondono a un file, vince l'ULTIMA (precedence "override").

# 1) Predefinito: codice, configurazione e documentazione tecnica, MIT.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Luigi Massari"
SPDX-License-Identifier = "MIT"

# 2) Asset originali del gioco: tutti i diritti riservati, niente addestramento AI.
#    Gli sprite dei personaggi (atlanti dei colori e delle normali) sono derivati da sorgenti CC0 che restano fuori
#    dal repo: Quaternius Universal Base Characters e Universal Animation Library 1-2 (versione Standard) e
#    Mesh2Motion (vedi THIRD-PARTY-NOTICES.md e tools/sprites/FONTI.md). Il CC0 non chiede annotazioni qui.
#    I font CAR Pixel sono disegnati da noi (tools/fxui): sono grafica del gioco, non codice.
#    I livelli (game/data/levels e le mappe di game/data/platform) e i copioni delle scene (game/data/scene)
#    sono level design e storia: asset anche loro, non codice.
[[annotations]]
path = [
  "docs/lore/**",
  "game/assets/sprites/**",
  "game/assets/env/**",
  "game/assets/props/**",
  "game/assets/fx/**",
  "game/assets/ui/**",
  "game/assets/murales/**",
  "game/assets/fonts/**",
  "game/assets/sfx/**",
  "game/data/levels/**",
  "game/data/platform/*.ldtk",
  "game/data/platform/*.txt",
  "game/data/scene/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Luigi Massari"
SPDX-License-Identifier = "LicenseRef-CAR-Assets"

# 2b) Effetti sonori con uno strato di "Punch SFX" di DavidW (OpenGameArt, CC BY 4.0, modificati):
#     restano asset del gioco, con l'autore dell'originale indicato (vedi THIRD-PARTY-NOTICES.md).
#     Gli altri effetti vengono da suoni CC0, che non chiedono annotazioni qui.
[[annotations]]
path = [
  "game/assets/sfx/hit_medium.wav",
  "game/assets/sfx/hit_heavy.wav",
  "game/assets/sfx/hit_kick.wav",
  "game/assets/sfx/ko.wav",
]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Luigi Massari", "DavidW (OpenGameArt, Punch SFX, CC-BY-4.0)"]
SPDX-License-Identifier = "LicenseRef-CAR-Assets"

# 3) Script bpy della pipeline: GPL, come chiede blender.org per gli script che usano l'API di Blender.
[[annotations]]
path = "tools/blender/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Luigi Massari"
SPDX-License-Identifier = "GPL-3.0-or-later"

# 4) Pack di terze parti e font: una tabella per pack, aggiunta insieme ai file
#    (licenza copiata dal pack stesso, testo in LICENSES/, riga in THIRD-PARTY-NOTICES.md).

# 5) Media del sito e del README, rifatti da tools/site/media.py con la grafica vera del gioco:
#    catture, strisce degli sprite, logo, font CAR Pixel in WOFF2, icone e i loro JSON.
#    Sono asset del gioco come gli originali. Queste tabelle vanno lasciate dopo quelle più
#    generali su site/, perché vince l'ultima.
[[annotations]]
path = [
  "site/media/**",
  "docs/media/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Luigi Massari"
SPDX-License-Identifier = "LicenseRef-CAR-Assets"

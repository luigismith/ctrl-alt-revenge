# Rete di sicurezza per il token di Instagram: si rinnova già a ogni
# pubblicazione, ma se la pubblicazione si ferma per due mesi il token muore.
name: Rinnova token Instagram

on:
  schedule:
    - cron: '17 3 * * 0'   # domenica notte
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rinnova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Identità git
        run: |
          git config user.name "ctrl-alt-revenge-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Rinnova se serve
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$STATE_KEY" ]; then echo "Secret non ancora impostati: niente da rinnovare."; exit 0; fi
          python -I -c "import sys; sys.path.insert(0, 'strumenti'); import token_ig; token_ig.token_corrente()"
          git add token.enc
          git diff --cached --quiet || (git commit -m "token: rinnovo automatico" && git push)

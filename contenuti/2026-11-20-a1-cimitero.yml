didascalia: |
  Taranto, 2087. Il primo tratto del cimitero di San Brunone, dal laboratorio: il set è un diorama di cartone tagliato e dipinto, e GIG un personaggio 3D che sembra un pupazzo da stop motion. Il cielo è ancora provvisorio.
  È un videogioco in sviluppo, fatto in Unreal Engine 5.

  Taranto, 2087. The first stretch of San Brunone cemetery, from the workshop: the set is a diorama of cut and painted cardboard, and GIG a 3D character made to look like a stop-motion puppet. The sky is still a placeholder.
  A video game in development, made in Unreal Engine 5.
